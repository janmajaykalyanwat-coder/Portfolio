<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="logoGlow">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feComposite in="SourceGraphic" in2="b" operator="over" />
    </filter>
  </defs>
  <!-- Outer Hexagonal / Chip Boundary -->
  <polygon points="50,6 92,28 92,72 50,94 8,72 8,28" fill="#090d16" stroke="url(#logoGrad)" stroke-width="3" filter="url(#logoGlow)" />
  <!-- Circuit Nodes on corners -->
  <circle cx="50" cy="6" r="3" fill="#00f0ff" />
  <circle cx="92" cy="28" r="3" fill="#8b5cf6" />
  <circle cx="92" cy="72" r="3" fill="#00f0ff" />
  <circle cx="50" cy="94" r="3" fill="#8b5cf6" />
  <circle cx="8" cy="72" r="3" fill="#00f0ff" />
  <circle cx="8" cy="28" r="3" fill="#8b5cf6" />
  <!-- Center Letters "JK" -->
  <text x="50" y="63" text-anchor="middle" font-family="'Orbitron', 'Space Grotesk', sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="1">JK</text>
</svg>
