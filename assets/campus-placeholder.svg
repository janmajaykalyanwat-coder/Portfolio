<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050816" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="glowCampus" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="campusGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.8" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Sky Background -->
  <rect width="900" height="500" rx="20" fill="url(#skyGrad)" />
  <rect width="900" height="500" rx="20" fill="url(#campusGrid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="450" cy="180" r="160" fill="#00f0ff" opacity="0.1" filter="url(#neonBlur)" />
  <circle cx="700" cy="140" r="140" fill="#a855f7" opacity="0.1" filter="url(#neonBlur)" />

  <!-- Digital Constellation / Satellite Links in Sky -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.4">
    <line x1="120" y1="80" x2="220" y2="120" />
    <line x1="220" y1="120" x2="350" y2="70" />
    <line x1="350" y1="70" x2="480" y2="110" />
    <line x1="480" y1="110" x2="620" y2="60" />
    <line x1="620" y1="60" x2="780" y2="100" />
    <circle cx="120" cy="80" r="3" fill="#38bdf8" />
    <circle cx="220" cy="120" r="3" fill="#00f0ff" />
    <circle cx="350" cy="70" r="3" fill="#a855f7" />
    <circle cx="480" cy="110" r="3" fill="#00f0ff" />
    <circle cx="620" cy="60" r="3" fill="#38bdf8" />
    <circle cx="780" cy="100" r="3" fill="#a855f7" />
  </g>

  <!-- Stylized Campus Academic Blocks (Silhouette with Tech Glow) -->
  <g opacity="0.95">
    <!-- Left Academic Block -->
    <rect x="80" y="220" width="160" height="200" rx="6" fill="url(#buildingGrad)" stroke="#334155" stroke-width="1.5" />
    <line x1="80" y1="260" x2="240" y2="260" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4" />
    <line x1="80" y1="300" x2="240" y2="300" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4" />
    <line x1="80" y1="340" x2="240" y2="340" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4" />
    <line x1="80" y1="380" x2="240" y2="380" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4" />

    <!-- Central Grand Academic & Administrative Dome Block (JECRC Landmark) -->
    <path d="M 280 420 L 280 200 L 370 170 L 450 140 L 530 170 L 620 200 L 620 420 Z" fill="url(#buildingGrad)" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.7" />
    <!-- Architectural Clock / Tech Portal -->
    <circle cx="450" cy="220" r="28" fill="#0f172a" stroke="#00f0ff" stroke-width="2" filter="url(#neonBlur)" />
    <circle cx="450" cy="220" r="18" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="450" cy="220" r="6" fill="#a855f7" />

    <!-- Center Pillars -->
    <g stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5">
      <line x1="330" y1="280" x2="330" y2="420" />
      <line x1="380" y1="280" x2="380" y2="420" />
      <line x1="520" y1="280" x2="520" y2="420" />
      <line x1="570" y1="280" x2="570" y2="420" />
    </g>

    <!-- Right Engineering & Research Wing -->
    <rect x="660" y="240" width="160" height="180" rx="6" fill="url(#buildingGrad)" stroke="#334155" stroke-width="1.5" />
    <line x1="660" y1="280" x2="820" y2="280" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4" />
    <line x1="660" y1="320" x2="820" y2="320" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4" />
    <line x1="660" y1="360" x2="820" y2="360" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4" />
  </g>

  <!-- Foreground Circuit Floor (Campus Ground with High-Tech Traces) -->
  <rect x="0" y="420" width="900" height="80" rx="0" fill="#090d16" stroke="#1e293b" stroke-width="1" />
  <line x1="0" y1="420" x2="900" y2="420" stroke="url(#glowCampus)" stroke-width="2" />

  <!-- Ground Traces -->
  <g stroke="#00f0ff" stroke-width="1.5" opacity="0.6">
    <path d="M 60 460 L 180 460 L 220 440 L 400 440" fill="none" />
    <circle cx="60" cy="460" r="3" fill="#00f0ff" />
    <path d="M 500 440 L 680 440 L 720 470 L 840 470" fill="none" />
    <circle cx="840" cy="470" r="3" fill="#00f0ff" />
  </g>

  <!-- Campus Label Glass Overlay Badge -->
  <g transform="translate(240, 30)">
    <rect x="0" y="0" width="420" height="70" rx="35" fill="#0b1120" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.5" />
    <text x="210" y="30" text-anchor="middle" font-family="'Orbitron', 'Space Grotesk', sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="2">JECRC UNIVERSITY</text>
    <text x="210" y="52" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#38bdf8" letter-spacing="1">CAMPUS &amp; ENGINEERING LABORATORIES</text>
  </g>

  <!-- Transparent Representation Notice Badge -->
  <g transform="translate(620, 445)">
    <rect x="0" y="0" width="250" height="26" rx="13" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <text x="125" y="17" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Stylized Campus Illustration</text>
  </g>
</svg>
