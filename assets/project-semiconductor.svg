<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="pSemiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="pSemiGlow">
      <feGaussianBlur stdDeviation="6" result="b" />
      <feComposite in="SourceGraphic" in2="b" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="360" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="2" />
  <!-- Circuit Grid -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.4" filter="url(#pSemiGlow)">
    <path d="M 60 180 H 220 L 260 140 H 340 L 380 180 H 540" fill="none" />
    <path d="M 120 80 V 160 L 160 200 V 280" fill="none" />
    <path d="M 480 80 V 160 L 440 200 V 280" fill="none" />
    <circle cx="260" cy="140" r="4" fill="#00f0ff" />
    <circle cx="340" cy="140" r="4" fill="#00f0ff" />
    <circle cx="60" cy="180" r="5" fill="#38bdf8" />
    <circle cx="540" cy="180" r="5" fill="#38bdf8" />
  </g>
  <!-- Central Chip Package -->
  <rect x="230" y="110" width="140" height="140" rx="16" fill="url(#pSemiGrad)" stroke="#00f0ff" stroke-width="2" />
  <!-- Logic Gate / Transistor Symbol -->
  <path d="M 270 150 L 300 150 M 270 190 L 300 190 M 300 140 V 200 M 300 170 H 330" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <!-- Text Overlay -->
  <text x="300" y="290" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="14" font-weight="700" fill="#38bdf8" letter-spacing="2">SEMICONDUCTOR &amp; ELECTRONICS</text>
  <text x="300" y="315" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">Upcoming Project Slot #1</text>
</svg>
