<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="chipBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="siliconDie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="30%" stop-color="#0369a1" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="goldTrace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowHeavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Chip -->
  <circle cx="400" cy="400" r="280" fill="url(#neonCyan)" opacity="0.12" filter="url(#glowHeavy)" />
  <circle cx="400" cy="400" r="180" fill="url(#neonPurple)" opacity="0.15" filter="url(#glowHeavy)" />

  <!-- Outer Circuit Traces & Bus Lines (PCB Ground) -->
  <g stroke="#1e293b" stroke-width="2" opacity="0.6">
    <line x1="80" y1="200" x2="220" y2="200" />
    <line x1="80" y1="240" x2="220" y2="240" />
    <line x1="80" y1="280" x2="220" y2="280" />
    <line x1="80" y1="320" x2="220" y2="320" />
    <line x1="80" y1="360" x2="220" y2="360" />
    <line x1="80" y1="440" x2="220" y2="440" />
    <line x1="80" y1="480" x2="220" y2="480" />
    <line x1="80" y1="520" x2="220" y2="520" />
    <line x1="80" y1="560" x2="220" y2="560" />
    <line x1="80" y1="600" x2="220" y2="600" />

    <line x1="580" y1="200" x2="720" y2="200" />
    <line x1="580" y1="240" x2="720" y2="240" />
    <line x1="580" y1="280" x2="720" y2="280" />
    <line x1="580" y1="320" x2="720" y2="320" />
    <line x1="580" y1="360" x2="720" y2="360" />
    <line x1="580" y1="440" x2="720" y2="440" />
    <line x1="580" y1="480" x2="720" y2="480" />
    <line x1="580" y1="520" x2="720" y2="520" />
    <line x1="580" y1="560" x2="720" y2="560" />
    <line x1="580" y1="600" x2="720" y2="600" />

    <line x1="200" y1="80" x2="200" y2="220" />
    <line x1="240" y1="80" x2="240" y2="220" />
    <line x1="280" y1="80" x2="280" y2="220" />
    <line x1="320" y1="80" x2="320" y2="220" />
    <line x1="360" y1="80" x2="360" y2="220" />
    <line x1="440" y1="80" x2="440" y2="220" />
    <line x1="480" y1="80" x2="480" y2="220" />
    <line x1="520" y1="80" x2="520" y2="220" />
    <line x1="560" y1="80" x2="560" y2="220" />
    <line x1="600" y1="80" x2="600" y2="220" />

    <line x1="200" y1="580" x2="200" y2="720" />
    <line x1="240" y1="580" x2="240" y2="720" />
    <line x1="280" y1="580" x2="280" y2="720" />
    <line x1="320" y1="580" x2="320" y2="720" />
    <line x1="360" y1="580" x2="360" y2="720" />
    <line x1="440" y1="580" x2="440" y2="720" />
    <line x1="480" y1="580" x2="480" y2="720" />
    <line x1="520" y1="580" x2="520" y2="720" />
    <line x1="560" y1="580" x2="560" y2="720" />
    <line x1="600" y1="580" x2="600" y2="720" />
  </g>

  <!-- Glowing Cyan Bus Traces -->
  <g stroke="#00f0ff" stroke-width="2.5" opacity="0.8" filter="url(#glowCyan)">
    <!-- Diagonal routes -->
    <path d="M 120 160 L 220 260 L 220 300" fill="none" />
    <circle cx="120" cy="160" r="4" fill="#00f0ff" />
    
    <path d="M 680 160 L 580 260 L 580 300" fill="none" />
    <circle cx="680" cy="160" r="4" fill="#00f0ff" />
    
    <path d="M 120 640 L 220 540 L 220 500" fill="none" />
    <circle cx="120" cy="640" r="4" fill="#00f0ff" />

    <path d="M 680 640 L 580 540 L 580 500" fill="none" />
    <circle cx="680" cy="640" r="4" fill="#00f0ff" />

    <!-- Pulse nodes -->
    <circle cx="220" cy="240" r="3" fill="#a855f7" />
    <circle cx="580" cy="240" r="3" fill="#a855f7" />
    <circle cx="220" cy="560" r="3" fill="#a855f7" />
    <circle cx="580" cy="560" r="3" fill="#a855f7" />
  </g>

  <!-- Outer Chip Package (Ceramic / LGA Package) -->
  <rect x="220" y="220" width="360" height="360" rx="36" fill="url(#chipBg)" stroke="#334155" stroke-width="3" />
  <rect x="226" y="226" width="348" height="348" rx="30" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Corner Notch / Pin 1 Indicator -->
  <circle cx="256" cy="256" r="10" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
  <circle cx="256" cy="256" r="4" fill="#fff" />

  <!-- Heat Spreader / Inner Bezel -->
  <rect x="270" y="270" width="260" height="260" rx="20" fill="#0b1120" stroke="#1e293b" stroke-width="2" />

  <!-- Silicon Die (The Core) -->
  <rect x="310" y="310" width="180" height="180" rx="12" fill="url(#siliconDie)" stroke="#00f0ff" stroke-width="2.5" filter="url(#glowCyan)" />

  <!-- Silicon Wafer Micro-Architecture Grid (Interconnects & Logic Blocks) -->
  <g opacity="0.65" stroke="#ffffff" stroke-width="1">
    <!-- ALU / Processing Core Grids -->
    <rect x="325" y="325" width="65" height="65" rx="4" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" />
    <rect x="410" y="325" width="65" height="65" rx="4" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" />
    <rect x="325" y="410" width="65" height="65" rx="4" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" />
    <rect x="410" y="410" width="65" height="65" rx="4" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" />

    <!-- Cache & Control Units -->
    <line x1="330" y1="340" x2="385" y2="340" stroke="#7dd3fc" stroke-width="1" />
    <line x1="330" y1="355" x2="385" y2="355" stroke="#7dd3fc" stroke-width="1" />
    <line x1="330" y1="370" x2="385" y2="370" stroke="#7dd3fc" stroke-width="1" />

    <line x1="415" y1="340" x2="470" y2="340" stroke="#7dd3fc" stroke-width="1" />
    <line x1="415" y1="355" x2="470" y2="355" stroke="#7dd3fc" stroke-width="1" />
    <line x1="415" y1="370" x2="470" y2="370" stroke="#7dd3fc" stroke-width="1" />

    <line x1="330" y1="425" x2="385" y2="425" stroke="#7dd3fc" stroke-width="1" />
    <line x1="330" y1="440" x2="385" y2="440" stroke="#7dd3fc" stroke-width="1" />
    <line x1="330" y1="455" x2="385" y2="455" stroke="#7dd3fc" stroke-width="1" />

    <line x1="415" y1="425" x2="470" y2="425" stroke="#7dd3fc" stroke-width="1" />
    <line x1="415" y1="440" x2="470" y2="440" stroke="#7dd3fc" stroke-width="1" />
    <line x1="415" y1="455" x2="470" y2="455" stroke="#7dd3fc" stroke-width="1" />
  </g>

  <!-- Central Processing Node / Core Interconnect -->
  <circle cx="400" cy="400" r="18" fill="#0f172a" stroke="#00f0ff" stroke-width="2.5" />
  <circle cx="400" cy="400" r="8" fill="#a855f7" filter="url(#glowCyan)" />

  <!-- Golden Wire Bonds (Die to Substrate) -->
  <g stroke="url(#goldTrace)" stroke-width="1.8" opacity="0.9">
    <line x1="310" y1="330" x2="270" y2="310" />
    <line x1="310" y1="360" x2="270" y2="350" />
    <line x1="310" y1="400" x2="270" y2="400" />
    <line x1="310" y1="440" x2="270" y2="450" />
    <line x1="310" y1="470" x2="270" y2="490" />

    <line x1="490" y1="330" x2="530" y2="310" />
    <line x1="490" y1="360" x2="530" y2="350" />
    <line x1="490" y1="400" x2="530" y2="400" />
    <line x1="490" y1="440" x2="530" y2="450" />
    <line x1="490" y1="470" x2="530" y2="490" />

    <line x1="330" y1="310" x2="310" y2="270" />
    <line x1="360" y1="310" x2="350" y2="270" />
    <line x1="400" y1="310" x2="400" y2="270" />
    <line x1="440" y1="310" x2="450" y2="270" />
    <line x1="470" y1="310" x2="490" y2="270" />

    <line x1="330" y1="490" x2="310" y2="530" />
    <line x1="360" y1="490" x2="350" y2="530" />
    <line x1="400" y1="490" x2="400" y2="530" />
    <line x1="440" y1="490" x2="450" y2="530" />
    <line x1="470" y1="490" x2="490" y2="530" />
  </g>

  <!-- High-Tech Labeling on Package -->
  <text x="400" y="515" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="3">ECE-SEMI-28nm</text>
  <text x="400" y="248" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" font-weight="600" fill="#38bdf8" letter-spacing="4">SILICON ARCHITECTURE</text>
</svg>
