<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="pInnoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="pInnoGlow">
      <feGaussianBlur stdDeviation="6" result="b" />
      <feComposite in="SourceGraphic" in2="b" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="360" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="2" />
  <!-- IoT Wireless Waves & Sensor Ring -->
  <circle cx="300" cy="170" r="110" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.3" />
  <circle cx="300" cy="170" r="75" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5" />
  <circle cx="300" cy="170" r="45" fill="url(#pInnoGrad)" filter="url(#pInnoGlow)" />
  <!-- Center Microcontroller Symbol -->
  <rect x="286" y="156" width="28" height="28" rx="4" fill="#0f172a" stroke="#ffffff" stroke-width="2" />
  <!-- Satellite Sensor Nodes -->
  <circle cx="190" cy="170" r="7" fill="#10b981" />
  <line x1="197" y1="170" x2="255" y2="170" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2 2" />
  <circle cx="410" cy="170" r="7" fill="#10b981" />
  <line x1="345" y1="170" x2="403" y2="170" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2 2" />
  <circle cx="300" cy="80" r="7" fill="#10b981" />
  <line x1="300" y1="87" x2="300" y2="125" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2 2" />
  <!-- Text Overlay -->
  <text x="300" y="300" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="14" font-weight="700" fill="#34d399" letter-spacing="2">ENGINEERING INNOVATION</text>
  <text x="300" y="325" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">Upcoming Project Slot #3</text>
</svg>
